<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#060a14" />
    </linearGradient>

    <!-- Agent Node Gradients -->
    <linearGradient id="agent1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.2)" />
      <stop offset="100%" stop-color="rgba(3, 105, 161, 0.1)" />
    </linearGradient>
    <linearGradient id="agent2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.2)" />
      <stop offset="100%" stop-color="rgba(126, 34, 206, 0.1)" />
    </linearGradient>
    <linearGradient id="agent3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.2)" />
      <stop offset="100%" stop-color="rgba(180, 83, 9, 0.1)" />
    </linearGradient>
    <linearGradient id="agent4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.2)" />
      <stop offset="100%" stop-color="rgba(4, 120, 87, 0.1)" />
    </linearGradient>

    <!-- Connectors Marker -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>

    <!-- Filters -->
    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern2" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bgGrad2)" rx="16" />
  <rect width="1100" height="680" fill="url(#gridPattern2)" rx="16" />
  <rect width="1100" height="680" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" rx="16" />

  <!-- Diagram Header -->
  <g transform="translate(40, 45)">
    <rect x="0" y="-12" width="180" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)" stroke="rgba(14, 165, 233, 0.4)" stroke-width="1" />
    <text x="10" y="3" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">
      MULTI-AGENT ARCHITECTURE
    </text>
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.3">
      DisasterLens AI Decision Pipeline
    </text>
    <text x="0" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">
      Sequential deterministic state machine with explainable audit telemetry and human authorization.
    </text>
  </g>

  <!-- STAGE 0: INGESTION LAYER -->
  <g transform="translate(40, 130)">
    <rect width="210" height="420" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(71, 85, 105, 0.5)" stroke-width="1.5" />
    <rect width="210" height="34" rx="12" fill="rgba(30, 41, 59, 0.9)" />
    <text x="16" y="22" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">
      1. INGESTION SOURCES
    </text>

    <!-- Source Items -->
    <g transform="translate(14, 48)">
      <!-- Open-Meteo -->
      <rect width="182" height="68" rx="8" fill="rgba(10, 16, 32, 0.8)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="12" y="24" font-size="14">🛰️</text>
      <text x="34" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Open-Meteo API</text>
      <text x="12" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Rainfall rate (mm/h), wind,</text>
      <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">surface humidity, temp</text>
    </g>

    <g transform="translate(14, 126)">
      <!-- River Gauges -->
      <rect width="182" height="68" rx="8" fill="rgba(10, 16, 32, 0.8)" stroke="rgba(14, 165, 233, 0.25)" stroke-width="1" />
      <text x="12" y="24" font-size="14">🌊</text>
      <text x="34" y="22" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Hydrologic Sensors</text>
      <text x="12" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">River gauge delta (m/45min),</text>
      <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">dam sluice outflow rate</text>
    </g>

    <g transform="translate(14, 204)">
      <!-- Citizen Reports -->
      <rect width="182" height="68" rx="8" fill="rgba(10, 16, 32, 0.8)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />
      <text x="12" y="24" font-size="14">📱</text>
      <text x="34" y="22" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Citizen SOS Feeds</text>
      <text x="12" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Mobile reports, coordinates,</text>
      <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">damage claims, voice audio</text>
    </g>

    <g transform="translate(14, 282)">
      <!-- Simulator -->
      <rect width="182" height="68" rx="8" fill="rgba(10, 16, 32, 0.8)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
      <text x="12" y="24" font-size="14">⚡</text>
      <text x="34" y="22" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">EOC Scenario Sim</text>
      <text x="12" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Preset flash floods, dam burst,</text>
      <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">cyclone and power outage tests</text>
    </g>
  </g>

  <!-- Flow Arrow from Ingestion to Pipeline -->
  <path d="M 250 340 L 295 340" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />

  <!-- PIPELINE AGENTS 1 TO 4 (COLUMN 2 & 3) -->
  <g transform="translate(305, 130)">
    <!-- Agent 1: Hazard Intelligence -->
    <g transform="translate(0, 0)">
      <rect width="235" height="195" rx="12" fill="url(#agent1Grad)" stroke="rgba(14, 165, 233, 0.6)" stroke-width="1.5" />
      <rect width="235" height="32" rx="12" fill="rgba(14, 165, 233, 0.3)" />
      <text x="14" y="21" font-size="14">🌊</text>
      <text x="36" y="21" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">Agent 1: Hazard Intel</text>

      <text x="14" y="54" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Functions &amp; Models:</text>
      <text x="14" y="72" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Open-Meteo real-time polling</text>
      <text x="14" y="88" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• River gauge danger thresholds</text>
      <text x="14" y="104" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Flash flood stage classifier</text>

      <rect x="12" y="122" width="211" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="20" y="140" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="700">OUTPUT: HazardPayload</text>
      <text x="20" y="156" fill="#94a3b8" font-family="monospace" font-size="9">stage: EXTREME_DANGER</text>
      <text x="20" y="170" fill="#94a3b8" font-family="monospace" font-size="9">radius_km: 3.5 | surge: 45m</text>
    </g>

    <!-- Connector: Agent 1 -> Agent 2 -->
    <path d="M 117 195 L 117 220" stroke="#a855f7" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />

    <!-- Agent 2: Report Validation -->
    <g transform="translate(0, 225)">
      <rect width="235" height="195" rx="12" fill="url(#agent2Grad)" stroke="rgba(168, 85, 247, 0.6)" stroke-width="1.5" />
      <rect width="235" height="32" rx="12" fill="rgba(168, 85, 247, 0.3)" />
      <text x="14" y="21" font-size="14">🔍</text>
      <text x="36" y="21" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">Agent 2: Validation</text>

      <text x="14" y="54" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Functions &amp; Models:</text>
      <text x="14" y="72" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Haversine distance (&lt;= 2.5km)</text>
      <text x="14" y="88" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Spatial clustering &amp; dup groups</text>
      <text x="14" y="104" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Source credibility weighting</text>

      <rect x="12" y="122" width="211" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
      <text x="20" y="140" fill="#c084fc" font-family="monospace" font-size="9.5" font-weight="700">OUTPUT: ValidatedReport</text>
      <text x="20" y="156" fill="#94a3b8" font-family="monospace" font-size="9">status: verified_cluster</text>
      <text x="20" y="170" fill="#94a3b8" font-family="monospace" font-size="9">credibility_weight: 0.92</text>
    </g>
  </g>

  <!-- Flow Connector: Agent 2 to Agent 3 -->
  <path d="M 540 340 L 575 340" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber)" />

  <!-- COLUMN 3: AGENT 3 & AGENT 4 -->
  <g transform="translate(585, 130)">
    <!-- Agent 3: Risk Assessment -->
    <g transform="translate(0, 0)">
      <rect width="235" height="195" rx="12" fill="url(#agent3Grad)" stroke="rgba(245, 158, 11, 0.6)" stroke-width="1.5" />
      <rect width="235" height="32" rx="12" fill="rgba(245, 158, 11, 0.3)" />
      <text x="14" y="21" font-size="14">⚖️</text>
      <text x="36" y="21" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">Agent 3: Risk Engine</text>

      <text x="14" y="54" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Mathematical Model:</text>
      <text x="14" y="72" fill="#fbbf24" font-family="monospace" font-size="10.5" font-weight="700">R = 0.4H+0.3E+0.2V+0.1D</text>
      <text x="14" y="88" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Hard safety constraint rules</text>
      <text x="14" y="104" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Life-safety override detector</text>

      <rect x="12" y="122" width="211" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
      <text x="20" y="140" fill="#fbbf24" font-family="monospace" font-size="9.5" font-weight="700">OUTPUT: RiskAssessment</text>
      <text x="20" y="156" fill="#f87171" font-family="monospace" font-size="9" font-weight="700">composite_score: 86.1 / 100</text>
      <text x="20" y="170" fill="#fca5a5" font-family="monospace" font-size="9">SAFETY_OVERRIDE: ACTIVE</text>
    </g>

    <!-- Connector: Agent 3 -> Agent 4 -->
    <path d="M 117 195 L 117 220" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrowEmerald)" />

    <!-- Agent 4: Response Planning -->
    <g transform="translate(0, 225)">
      <rect width="235" height="195" rx="12" fill="url(#agent4Grad)" stroke="rgba(16, 185, 129, 0.6)" stroke-width="1.5" />
      <rect width="235" height="32" rx="12" fill="rgba(16, 185, 129, 0.3)" />
      <text x="14" y="21" font-size="14">📋</text>
      <text x="36" y="21" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">Agent 4: Response SOP</text>

      <text x="14" y="54" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Functions &amp; Inventory:</text>
      <text x="14" y="72" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• NDRF standard operating rules</text>
      <text x="14" y="88" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Nearby shelter capacity fit</text>
      <text x="14" y="104" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Rescue boat &amp; pump staging</text>

      <rect x="12" y="122" width="211" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="20" y="140" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="700">OUTPUT: SOPRecommendations</text>
      <text x="20" y="156" fill="#94a3b8" font-family="monospace" font-size="9">action: Deploy SDRF Team 1</text>
      <text x="20" y="170" fill="#94a3b8" font-family="monospace" font-size="9">depot: 0.3km | status: PENDING</text>
    </g>
  </g>

  <!-- Flow Connector: Agent 4 to Coordinator -->
  <path d="M 820 340 L 855 340" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrowEmerald)" />

  <!-- COLUMN 4: COORDINATOR & HUMAN-IN-THE-LOOP -->
  <g transform="translate(865, 130)">
    <!-- Agent 5: Decision Coordinator & Bilingual Synthesizer -->
    <rect width="195" height="420" rx="12" fill="rgba(30, 27, 75, 0.6)" stroke="rgba(129, 140, 248, 0.6)" stroke-width="1.5" />
    <rect width="195" height="34" rx="12" fill="rgba(67, 56, 202, 0.5)" />
    <text x="14" y="22" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">
      5. ORCHESTRATOR
    </text>

    <!-- Briefing Block -->
    <g transform="translate(12, 48)">
      <rect width="171" height="100" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
      <text x="10" y="20" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">Bilingual Synthesizer:</text>
      <text x="10" y="38" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="9">• English Decision Brief</text>
      <text x="10" y="52" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="9">• Hindi (हिंदी) Translation</text>
      <text x="10" y="66" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="9">• 6 Regional Dialects</text>
      <text x="10" y="84" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">✓ Web Speech Voice Syn</text>
    </g>

    <!-- Human-in-the-Loop Decision Gate -->
    <g transform="translate(12, 160)">
      <rect width="171" height="135" rx="8" fill="rgba(220, 38, 38, 0.15)" stroke="rgba(239, 68, 68, 0.6)" stroke-width="1.5" />
      <text x="10" y="22" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800">
        HUMAN-IN-THE-LOOP
      </text>
      <text x="10" y="40" fill="#fee2e2" font-family="-apple-system, sans-serif" font-size="9">EOC Commander Review:</text>

      <!-- Action Buttons Preview -->
      <rect x="10" y="52" width="46" height="20" rx="4" fill="#059669" />
      <text x="16" y="66" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">Approve</text>

      <rect x="62" y="52" width="44" height="20" rx="4" fill="#d97706" />
      <text x="70" y="66" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">Modify</text>

      <rect x="112" y="52" width="44" height="20" rx="4" fill="#dc2626" />
      <text x="121" y="66" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">Reject</text>

      <text x="10" y="92" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5">• Officer notes captured</text>
      <text x="10" y="106" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5">• Mandatory for dispatch</text>
      <text x="10" y="120" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5">• Zero unchecked actions</text>
    </g>

    <!-- Immutable Audit Trail -->
    <g transform="translate(12, 305)">
      <rect width="171" height="100" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
      <text x="10" y="20" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">Audit &amp; WebSocket:</text>
      <text x="10" y="38" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9">• Immutable DB stamp</text>
      <text x="10" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9">• WebSocket /ws/incidents</text>
      <text x="10" y="66" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9">• Real-time audio siren</text>
      <text x="10" y="84" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">➔ Leaflet Vector Draw</text>
    </g>
  </g>

  <!-- Bottom Execution Metrics Ribbon -->
  <g transform="translate(40, 580)">
    <rect width="1020" height="60" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <g transform="translate(25, 35)">
      <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">PIPELINE TELEMETRY:</text>
      <text x="160" y="0" fill="#94a3b8" font-family="monospace" font-size="11">Total Cycle: &lt; 1,600 ms</text>
      <text x="350" y="0" fill="#94a3b8" font-family="monospace" font-size="11">Deduplication Precision: 98.4%</text>
      <text x="590" y="0" fill="#94a3b8" font-family="monospace" font-size="11">Safety Rule Recall: 100%</text>
      <text x="810" y="0" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">OFFLINE RESILIENT: YES</text>
    </g>
  </g>
</svg>
