<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050812" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <marker id="arrowWhite" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffffff" />
    </marker>
    <marker id="arrowCyan2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>

    <pattern id="gridPattern4" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1100" height="640" fill="url(#bgGrad4)" rx="16" />
  <rect width="1100" height="640" fill="url(#gridPattern4)" rx="16" />
  <rect width="1100" height="640" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" rx="16" />

  <!-- Diagram Header -->
  <g transform="translate(40, 45)">
    <rect x="0" y="-12" width="230" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="10" y="3" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">
      OPERATIONAL RESPONSE LIFECYCLE
    </text>
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.3">
      End-to-End Emergency Response &amp; Resource Orchestration
    </text>
    <text x="0" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">
      Connecting multi-source sensors, voice-enabled AI copilot, and authorized field dispatch.
    </text>
  </g>

  <!-- 5 STAGE HORIZONTAL FLOW -->
  <g transform="translate(40, 130)">
    <!-- STAGE 1: Citizen & Sensor Inputs -->
    <g transform="translate(0, 0)">
      <rect width="180" height="340" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <rect width="180" height="34" rx="12" fill="rgba(14, 165, 233, 0.2)" />
      <text x="12" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">
        STEP 1: INGESTION
      </text>

      <g transform="translate(12, 50)">
        <text x="0" y="15" font-size="14">🌊</text>
        <text x="24" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Sensor Feeds</text>
        <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">River gauge delta</text>
        <text x="0" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Open-Meteo rain radar</text>

        <line x1="0" y1="62" x2="156" y2="62" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="86" font-size="14">📱</text>
        <text x="24" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Citizen SOS</text>
        <text x="0" y="103" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Public report intake</text>
        <text x="0" y="117" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Voice SOS dictation</text>

        <line x1="0" y1="133" x2="156" y2="133" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="157" font-size="14">⚡</text>
        <text x="24" y="156" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Sim Ingestion</text>
        <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Preset judge drills</text>
        <text x="0" y="188" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Instant test injection</text>

        <rect x="0" y="215" width="156" height="50" rx="6" fill="rgba(14, 165, 233, 0.15)" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="10" y="235" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700">FastAPI Pipeline</text>
        <text x="10" y="250" fill="#cbd5e1" font-family="monospace" font-size="8.5">POST /api/incidents</text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 185 170 L 205 170" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan2)" />

    <!-- STAGE 2: Multi-Agent Analysis -->
    <g transform="translate(210, 0)">
      <rect width="180" height="340" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
      <rect width="180" height="34" rx="12" fill="rgba(147, 51, 234, 0.2)" />
      <text x="12" y="22" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">
        STEP 2: AI PIPELINE
      </text>

      <g transform="translate(12, 50)">
        <text x="0" y="15" font-size="14">🤖</text>
        <text x="24" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Agent Analysis</text>
        <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">1. Hazard Classification</text>
        <text x="0" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">2. Report Deduplication</text>

        <line x1="0" y1="62" x2="156" y2="62" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="86" font-size="14">⚖️</text>
        <text x="24" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Risk Math Engine</text>
        <text x="0" y="103" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">0.4H+0.3E+0.2V+0.1D</text>
        <text x="0" y="117" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9.5">Safety Rule Override</text>

        <line x1="0" y1="133" x2="156" y2="133" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="157" font-size="14">📋</text>
        <text x="24" y="156" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SOP Planning</text>
        <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Match nearby shelters</text>
        <text x="0" y="188" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Platoon staging plan</text>

        <rect x="0" y="215" width="156" height="50" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" />
        <text x="10" y="235" fill="#c084fc" font-family="monospace" font-size="9" font-weight="700">Latency: 1,521 ms</text>
        <text x="10" y="250" fill="#cbd5e1" font-family="monospace" font-size="8.5">Verified JSON Output</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 395 170 L 415 170" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan2)" />

    <!-- STAGE 3: EOC Co-Pilot & Voice UI -->
    <g transform="translate(420, 0)">
      <rect width="180" height="340" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
      <rect width="180" height="34" rx="12" fill="rgba(217, 119, 6, 0.2)" />
      <text x="12" y="22" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">
        STEP 3: AI CO-PILOT
      </text>

      <g transform="translate(12, 50)">
        <text x="0" y="15" font-size="14">🎙️</text>
        <text x="24" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Voice Assistant</text>
        <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Web Speech synthesis</text>
        <text x="0" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Auto-readout toggle</text>

        <line x1="0" y1="62" x2="156" y2="62" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="86" font-size="14">🇮🇳</text>
        <text x="24" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">6 Indian Dialects</text>
        <text x="0" y="103" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Hindi, Bengali, Tamil,</text>
        <text x="0" y="117" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Telugu, Marathi, English</text>

        <line x1="0" y1="133" x2="156" y2="133" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="157" font-size="14">💬</text>
        <text x="24" y="156" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Co-Pilot Chat</text>
        <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Evacuation corridors</text>
        <text x="0" y="188" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Hospital triage status</text>

        <rect x="0" y="215" width="156" height="50" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="10" y="235" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="700">POST /copilot/query</text>
        <text x="10" y="250" fill="#cbd5e1" font-family="monospace" font-size="8.5">Gemini 2.5 Flash + Fallback</text>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 605 170 L 625 170" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan2)" />

    <!-- STAGE 4: Human-in-the-Loop Review -->
    <g transform="translate(630, 0)">
      <rect width="180" height="340" rx="12" fill="rgba(220, 38, 38, 0.1)" stroke="rgba(239, 68, 68, 0.5)" stroke-width="1.5" />
      <rect width="180" height="34" rx="12" fill="rgba(185, 28, 28, 0.3)" />
      <text x="12" y="22" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">
        STEP 4: HUMAN GATE
      </text>

      <g transform="translate(12, 50)">
        <text x="0" y="15" font-size="14">👮</text>
        <text x="24" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Incident Cmdr</text>
        <text x="0" y="32" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5">Mandatory sign-off</text>
        <text x="0" y="46" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5">High-consequence rule</text>

        <line x1="0" y1="62" x2="156" y2="62" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="86" font-size="14">✍️</text>
        <text x="24" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Review Actions</text>
        <text x="0" y="103" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5">● Approve recommendation</text>
        <text x="0" y="117" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9.5">● Modify route / units</text>
        <text x="0" y="131" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9.5">● Reject / quarantine</text>

        <line x1="0" y1="147" x2="156" y2="147" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="171" font-size="14">📜</text>
        <text x="24" y="170" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Audit Trail</text>
        <text x="0" y="188" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Immutable record stamp</text>

        <rect x="0" y="215" width="156" height="50" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="rgba(239, 68, 68, 0.4)" />
        <text x="10" y="235" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">POST /recommendations</text>
        <text x="10" y="250" fill="#ffffff" font-family="monospace" font-size="8.5">signed_by: Cmdr Kumar</text>
      </g>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 815 170 L 835 170" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrowEmerald2)" />

    <!-- STAGE 5: Tactical Execution & Staging -->
    <g transform="translate(840, 0)">
      <rect width="180" height="340" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
      <rect width="180" height="34" rx="12" fill="rgba(5, 150, 105, 0.25)" />
      <text x="12" y="22" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">
        STEP 5: DISPATCH
      </text>

      <g transform="translate(12, 50)">
        <text x="0" y="15" font-size="14">🗺️</text>
        <text x="24" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Tactical GIS Map</text>
        <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">CartoDB Voyager / Dark</text>
        <text x="0" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Pulsing radar beacon</text>

        <line x1="0" y1="62" x2="156" y2="62" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="86" font-size="14">⚡</text>
        <text x="24" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Laser Vectors</text>
        <text x="0" y="103" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Animated dispatch lines</text>
        <text x="0" y="117" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Depot to disaster point</text>

        <line x1="0" y1="133" x2="156" y2="133" stroke="rgba(255,255,255,0.08)" />

        <text x="0" y="157" font-size="14">🚤</text>
        <text x="24" y="156" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Field Deployed</text>
        <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">SDRF Rescue Boat 1</text>
        <text x="0" y="188" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Dewatering Pump Platoon</text>

        <rect x="0" y="215" width="156" height="50" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" />
        <text x="10" y="235" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">STATUS: DEPLOYED</text>
        <text x="10" y="250" fill="#ffffff" font-family="monospace" font-size="8.5">Capacity: 120 souls</text>
      </g>
    </g>
  </g>

  <!-- Real-time Feedback Loop Back to Ingestion -->
  <path d="M 930 490 L 930 540 L 90 540 L 90 490" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowCyan2)" />
  <rect x="420" y="525" width="260" height="30" rx="6" fill="rgba(10, 16, 32, 0.95)" stroke="rgba(56, 189, 248, 0.4)" />
  <text x="435" y="544" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">
    ↺ Continuous Feedback &amp; Evacuation Progress Loop
  </text>
</svg>
