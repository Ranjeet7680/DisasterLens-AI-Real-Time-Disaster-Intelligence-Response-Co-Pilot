<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1022" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Glowing Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#60a5fa" />
      <stop offset="75%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="pulseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#gridPattern)" />

  <!-- Tactical Decorative Top & Bottom Borders -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#titleGrad)" />
  <rect x="0" y="377" width="1200" height="3" fill="url(#titleGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="180" r="160" fill="#7c3aed" opacity="0.1" filter="blur(60px)" />
  <circle cx="600" cy="80" r="100" fill="#ef4444" opacity="0.08" filter="blur(50px)" />

  <!-- Tactical Radar Rings in Background -->
  <circle cx="180" cy="180" r="130" fill="none" stroke="rgba(6, 182, 212, 0.1)" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="180" cy="180" r="90" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5" />
  <circle cx="180" cy="180" r="50" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1.5" />

  <!-- Central DisasterLens AI Emblem -->
  <g transform="translate(180, 180)">
    <!-- Hexagonal Shield Outline -->
    <polygon points="0,-68 58,-34 58,34 0,68 -58,34 -58,-34" fill="rgba(10, 20, 45, 0.85)" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glowCyan)" />

    <!-- Wave Elements (Flood & Cyclones) -->
    <path d="M-36,12 C-20,0 -8,22 8,10 C20,0 32,16 40,8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M-36,24 C-20,12 -8,34 8,22 C20,12 32,28 40,20" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Central Neural Eye / Aperture Core -->
    <circle cx="0" cy="-12" r="18" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="2" />
    <circle cx="0" cy="-12" r="8" fill="#ef4444" filter="url(#glowRed)" />
    <circle cx="0" cy="-12" r="3" fill="#ffffff" />

    <!-- Reticle Ticks -->
    <line x1="0" y1="-75" x2="0" y2="-62" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="62" x2="0" y2="75" stroke="#38bdf8" stroke-width="2" />
    <line x1="-68" y1="0" x2="-54" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="54" y1="0" x2="68" y2="0" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Title & Subtitle Block -->
  <g transform="translate(300, 85)">
    <!-- Top Tactical Tag -->
    <rect x="0" y="0" width="220" height="24" rx="4" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#10b981" />
    <text x="24" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.5">
      MISSION-CRITICAL EOC PLATFORM
    </text>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
      DisasterLens AI
    </text>

    <!-- Secondary Title Tagline -->
    <text x="0" y="104" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
      Real-Time Disaster Intelligence &amp; Autonomous Response Decision Co-Pilot
    </text>

    <!-- Descriptive Pitch -->
    <text x="0" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Coordinating hazard sensors, multi-agent AI validation, deterministic risk formulas, and approved SOP dispatch.
    </text>
  </g>

  <!-- Capability Badges Bar -->
  <g transform="translate(300, 260)">
    <!-- Badge 1: Multi-Agent AI -->
    <g transform="translate(0, 0)">
      <rect width="155" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
      <text x="14" y="22" font-size="13">🤖</text>
      <text x="36" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">4-Agent Pipeline</text>
    </g>

    <!-- Badge 2: Deterministic Risk -->
    <g transform="translate(165, 0)">
      <rect width="180" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
      <text x="14" y="22" font-size="13">⚖️</text>
      <text x="36" y="21" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Explainable Risk R</text>
    </g>

    <!-- Badge 3: Voice & 6 Languages -->
    <g transform="translate(355, 0)">
      <rect width="175" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <text x="14" y="22" font-size="13">🎙️</text>
      <text x="36" y="21" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">6 Indian Languages</text>
    </g>

    <!-- Badge 4: Human in the Loop -->
    <g transform="translate(540, 0)">
      <rect width="165" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1" />
      <text x="14" y="22" font-size="13">🛡️</text>
      <text x="36" y="21" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Human Approval</text>
    </g>

    <!-- Badge 5: Live Leaflet -->
    <g transform="translate(715, 0)">
      <rect width="145" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
      <text x="14" y="22" font-size="13">🗺️</text>
      <text x="36" y="21" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Tactical GIS Map</text>
    </g>
  </g>

  <!-- Corner Tech Accents -->
  <g stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" fill="none">
    <path d="M 15 35 L 15 15 L 35 15" />
    <path d="M 1185 35 L 1185 15 L 1165 15" />
    <path d="M 15 345 L 15 365 L 35 365" />
    <path d="M 1185 345 L 1185 365 L 1165 365" />
  </g>
</svg>
